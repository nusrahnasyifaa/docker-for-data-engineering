[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syifaa", email = "149243355+nusrahnasyifaa@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "psycopg[binary,pool]>=3.3.9",
    "pyarrow>=26.0.1",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]
